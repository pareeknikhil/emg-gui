<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">EMG GUI architecture and package boundaries</title>
  <desc id="desc">A sensor worker thread polls a DataSource, records raw samples and markers, and publishes the latest rolling snapshot. The main GUI thread reads that snapshot, filters copies, computes spectra, and submits graphics to the GPU. Queued Qt signals carry controls and status between threads. Shared core and config packages support both sides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#48647a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203448; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #536a7d; }
      .lane { font-size: 21px; font-weight: 700; }
      .tag { font-size: 15px; font-weight: 700; fill: #25687b; }
      .name { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #536a7d; }
      .flow { fill: none; stroke: #48647a; stroke-width: 2; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #48647a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #cedbe5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="1020" rx="20" fill="#f8fafc"/>
  <text x="40" y="52" class="title">EMG GUI · architecture</text>
  <text x="40" y="82" class="sub">Package responsibilities, runtime threads, and the path from samples to screen</text>

  <rect x="40" y="108" width="1120" height="78" rx="12" class="card"/>
  <text x="62" y="139" class="name">Your Python script</text>
  <text x="62" y="165" class="body">Creates the logger and data source, runs the window, and releases resources after exit.</text>
  <text x="1138" y="139" text-anchor="end" class="small">MAIN THREAD · SETUP / CLEANUP</text>

  <rect x="40" y="214" width="460" height="626" rx="16" fill="#eaf5f4" stroke="#c8e2df"/>
  <rect x="680" y="214" width="480" height="626" rx="16" fill="#eef1fc" stroke="#d5dcf2"/>
  <text x="62" y="250" class="lane">Sensor worker thread</text>
  <text x="702" y="250" class="lane">Main / GUI thread</text>

  <rect x="62" y="276" width="416" height="140" rx="10" class="card"/>
  <text x="82" y="303" class="tag">acquisition/ · source and polling</text>
  <text x="82" y="333" class="name">SensorWorker + DataSource</text>
  <text x="82" y="360" class="body">OpenBCIBoard → BrainFlow</text>
  <text x="82" y="384" class="body">PlaybackRecording → saved file</text>
  <text x="82" y="405" class="small">QTimer polls the selected source.</text>

  <rect x="702" y="276" width="436" height="140" rx="10" class="card"/>
  <text x="722" y="303" class="tag">ui/ · controls and coordination</text>
  <text x="722" y="333" class="name">EMGVisualizerWindow</text>
  <text x="722" y="360" class="body">EMGControlPanel → stream, record, markers</text>
  <text x="722" y="384" class="body">Creates the worker and OpenGL widget.</text>
  <text x="722" y="405" class="small">Schedules the next read after each frame cycle.</text>

  <path d="M 702 325 H 478" class="signal"/>
  <text x="590" y="308" text-anchor="middle" class="small">Control requests</text>
  <path d="M 478 382 H 702" class="signal"/>
  <text x="590" y="369" text-anchor="middle" class="small">Status updates</text>

  <path d="M 270 416 V 470" class="flow"/>
  <text x="283" y="447" class="small">EMG samples</text>
  <rect x="62" y="470" width="416" height="118" rx="10" class="card"/>
  <text x="82" y="498" class="tag">acquisition/ · display buffer</text>
  <text x="82" y="527" class="name">Rolling buffer → latest snapshot</text>
  <text x="82" y="554" class="body">Publishes a complete copy of the window.</text>
  <text x="82" y="577" class="small">The GUI reads the latest available snapshot.</text>

  <path d="M 478 529 H 702" class="flow"/>
  <text x="590" y="506" text-anchor="middle" class="small">Latest snapshot</text>
  <text x="590" y="552" text-anchor="middle" class="small">No display-frame queue</text>
  <path d="M 920 416 V 470" class="flow"/>
  <text x="934" y="447" class="small">Render loop</text>

  <rect x="702" y="470" width="436" height="118" rx="10" class="card"/>
  <text x="722" y="498" class="tag">visualizer/ + processing/ · CPU</text>
  <text x="722" y="527" class="name">EMGOpenGLWidget</text>
  <text x="722" y="554" class="body">Skips duplicates; filters a snapshot copy.</text>
  <text x="722" y="577" class="small">SpectrogramRenderer computes the windowed FFT.</text>

  <path d="M 62 347 H 51 V 700 H 62" class="flow"/>
  <rect x="62" y="646" width="416" height="148" rx="10" class="card"/>
  <text x="82" y="674" class="tag">acquisition/ · recording branch</text>
  <text x="82" y="704" class="name">Raw EMG + movement markers</text>
  <text x="82" y="731" class="body">Accumulates batches while recording.</text>
  <text x="82" y="755" class="body">Writes CSV when recording stops.</text>
  <text x="82" y="781" class="small">OpenBCIBoard only · same sensor worker thread</text>

  <path d="M 920 588 V 646" class="flow"/>
  <text x="934" y="623" class="small">Raw + filtered traces / spectrum</text>
  <rect x="702" y="646" width="436" height="148" rx="10" class="card"/>
  <text x="722" y="674" class="tag">visualizer/ · GPU rendering</text>
  <text x="722" y="704" class="name">ModernGL renderers + shaders</text>
  <text x="722" y="731" class="body">TimeSeriesRenderer · SpectrogramRenderer</text>
  <text x="722" y="755" class="body">TicksRenderer · TextRenderer</text>
  <text x="722" y="781" class="small">GUI thread submits graphics commands to the GPU.</text>

  <rect x="40" y="866" width="1120" height="86" rx="12" class="card"/>
  <text x="62" y="895" class="name">Shared support</text>
  <text x="62" y="925" class="body">core/ · logging, types, states</text>
  <text x="555" y="925" class="body">config/ · constants and packaged resources</text>
  <path d="M 42 984 H 84" class="flow"/>
  <text x="96" y="989" class="small">Data / execution flow</text>
  <path d="M 294 984 H 336" class="signal"/>
  <text x="348" y="989" class="small">Queued Qt signals</text>
  <text x="1158" y="989" text-anchor="end" class="small">Current implementation · filtering and FFT run on the GUI thread</text>
</svg>
